<style>
:root{
  --green:#34B233; --green-dark:#237023; --green-ink:#1B4D1B; --green-soft:#E6F4E4;
  --earth:#8C6A3D; --ochre:#C8A96A; --earth-soft:#F1E9DC; --paper:#F7F4EE; --card:#FFFFFF;
  --ink:#2B2B2B; --muted:#6B6257; --line:#DDD5C6;
  --go:#237023; --caution:#B8730A; --stop:#A93226; --info:#3B5B8C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* label.row sets display:flex, which would otherwise beat the browser default for [hidden] */
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:0 16px 32px}
header{background:var(--green);color:#fff;margin:0 -16px;padding:14px 16px;box-shadow:0 2px 0 var(--green-dark)}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.9}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{flex:1;min-width:0}
.tbtn{font:inherit;font-size:13px;font-weight:600;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.85);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;flex:none}
.tbtn:hover,.tbtn:focus{background:rgba(255,255,255,.15);outline:none}
.tbtn[hidden]{display:none}
main{max-width:720px;margin:0 auto}
.lead{margin:18px 0 10px;font-size:18px}
.bi .en{display:block}
.bi .fil{display:block;font-size:.86em;color:var(--muted);font-style:italic}
.tile .bi .fil{color:#5A6B5A}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:12px 12px 12px 14px;text-decoration:none;color:var(--ink);min-height:84px}
.tile:active{background:var(--green-soft)}
.tile .ico{font-size:22px;display:block;margin-bottom:4px}
.tile:nth-child(10),.tile:nth-child(11),.tile:nth-child(12){border-left-color:var(--earth)}
.foot{color:var(--muted);font-size:13px;margin-top:18px}
.back{display:inline-block;margin:12px 0 4px;color:var(--green-dark);text-decoration:none;font-weight:600}
h2{margin:6px 0 12px;font-size:20px;color:var(--green-ink)}
h3{font-size:16px;color:var(--green-ink);margin:18px 0 6px}
h4{margin:16px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--earth)}
.card-form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 16px}
fieldset.loc{border:1px dashed var(--ochre);border-radius:8px;padding:8px 10px 10px;margin:0 0 8px;background:var(--earth-soft)}
fieldset.loc legend{font-size:13px;color:var(--earth);padding:0 6px}
label.row{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:14px}
label.row input,label.row select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:42px}
label.row input:focus,label.row select:focus{outline:2px solid var(--green);border-color:var(--green)}
label.row.check{flex-direction:row;align-items:center;gap:10px}
label.row.check input{width:22px;height:22px;min-height:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.btn{font:inherit;border:1px solid var(--green-dark);background:var(--green-soft);color:var(--green-ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.small{font-size:13px;padding:6px 10px;margin:4px 0 6px}
.btn.primary{display:block;width:100%;margin-top:14px;background:var(--green);color:#fff;font-weight:700;font-size:17px;padding:12px;border-color:var(--green-dark)}
.btn.primary .bi .fil{color:#E8F5E5}
.result{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left-width:8px}
.result.go{border-left-color:var(--go)} .result.caution{border-left-color:var(--caution)} .result.stop{border-left-color:var(--stop)} .result.info{border-left-color:var(--info)}
.verdict{margin:0 0 8px;font-size:20px;line-height:1.3}
.verdict .en{display:block}
.verdict .fil{display:block;font-size:16px;font-weight:500;color:var(--muted);font-style:italic}
.result.go .verdict .en{color:var(--go)} .result.caution .verdict .en{color:var(--caution)} .result.stop .verdict .en{color:var(--stop)} .result.info .verdict .en{color:var(--info)}
dl.nums{margin:8px 0;display:grid;grid-template-columns:1fr;gap:4px}
dl.nums dt{font-size:13px;color:var(--muted);margin-top:6px}
dl.nums dd{margin:0;font-weight:600}
dl.nums dt.key{color:var(--green-ink,#1a5632);font-weight:700}
dl.nums dd.key{font-size:17px;padding:8px 10px;border-left:4px solid var(--green);background:var(--green-soft);border-radius:6px}
dl.nums dt.minor{font-size:12px;opacity:.85;margin-top:10px}
dl.nums dd.minor{font-size:12px;font-weight:400;color:var(--muted)}
details{margin:8px 0 0;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;font-weight:600;color:var(--green-ink);font-size:14px}
details.flags summary{color:var(--caution)}
details ul{margin:6px 0 0;padding-left:18px;font-size:14px}
details li{margin:4px 0}
.cls{font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:4px;background:var(--earth-soft);color:var(--earth)}
.cls.primary{background:var(--green-soft);color:var(--green-ink)}
.refs{padding-left:18px;font-size:14px} .refs li{margin:6px 0}
code{background:var(--earth-soft);padding:0 4px;border-radius:3px;font-size:12px}
.warn{background:var(--earth-soft);border-left:4px solid var(--ochre);padding:8px 10px;border-radius:6px}
.authority{font-size:13px;margin:0 0 10px}
.needs{font-size:13px;margin:0 0 8px;padding:0 2px;color:var(--ink)}
.needs strong{color:var(--earth)}
.needs .fil{color:var(--muted)}
.reading{font-size:13px;margin:0 0 12px;padding:8px 10px;border-left:4px solid var(--green);background:var(--green-soft);border-radius:6px}
.reading .fil{color:var(--green-ink)}
.authority .fil{color:var(--earth)}
.locnote{font-size:13px;margin:6px 0;color:var(--earth);font-weight:600}
.lochint{font-size:12px;margin:4px 0 8px;color:var(--muted)}
.locwarn{font-size:13px;margin:8px 0 0}
dl.nums dt.alert{color:#8a4b00;font-weight:700}
dl.nums dd.alert{font-size:14px;font-weight:400;padding:8px 10px;border-left:4px solid #d98324;background:#fdf3e6;border-radius:6px}
.haiku{margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--line,#ddd);text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.haiku .jp{font-size:16px;color:var(--ink);letter-spacing:.08em}
.haiku .romaji{font-style:italic}
.haiku .en{color:var(--ink);margin-top:6px;display:block}
.haiku .attrib{display:block;margin-top:8px;font-size:12px}
a{color:var(--green-dark)}
</style>
</head>

<header>
  <h1>AgriKalkunahon <small>Offline farm-weather decisions for the Philippines · Mga desisyon sa bukid batay sa panahon</small></h1>

</header>
<main id="main"></main>

/*__ENGINE__*/
</script>
<script>

</script>
</body>
</html>
