<style>
:root{
  --green:#34B233; --green-dark:#237023; --green-ink:#1B4D1B; --green-soft:#E6F4E4;
  --earth:#8C6A3D; --ochre:#C8A96A; --earth-soft:#F1E9DC; --paper:#F7F4EE; --card:#FFFFFF;

*{box-sizing:border-box}
[hidden]{display:none!important}   /* label.row sets display:flex, which would otherwise beat the browser default for [hidden] */
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:0 16px 32px}
header{background:var(--green);color:#fff;margin:0 -16px;padding:14px 16px;box-shadow:0 2px 0 var(--green-dark)}

header h1 small{display:block;font-size:12px;font-weight:400;opacity:.9}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{flex:1;min-width:0}
.tbtn{font:inherit;font-size:13px;font-weight:600;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.85);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;flex:none}
.tbtn:hover,.tbtn:focus{background:rgba(255,255,255,.15);outline:none}
.tbtn[hidden]{display:none}
main{max-width:720px;margin:0 auto}
.lead{margin:18px 0 10px;font-size:18px}
.bi .en{display:block}
.bi .fil{display:block;font-size:.86em;color:var(--muted);font-style:italic}
.tile .bi .fil{color:#5A6B5A}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:12px 12px 12px 14px;text-decoration:none;color:var(--ink);min-height:84px}
.tile:active{background:var(--green-soft)}
.tile .ico{font-size:22px;display:block;margin-bottom:4px}
.tile:nth-child(10),.tile:nth-child(11),.tile:nth-child(12){border-left-color:var(--earth)}
.foot{color:var(--muted);font-size:13px;margin-top:18px}
.back{display:inline-block;margin:12px 0 4px;color:var(--green-dark);text-decoration:none;font-weight:600}
h2{margin:6px 0 12px;font-size:20px;color:var(--green-ink)}
h3{font-size:16px;color:var(--green-ink);margin:18px 0 6px}
h4{margin:16px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--earth)}
.card-form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 16px}
fieldset.loc{border:1px dashed var(--ochre);border-radius:8px;padding:8px 10px 10px;margin:0 0 8px;background:var(--earth-soft)}
fieldset.loc legend{font-size:13px;color:var(--earth);padding:0 6px}
label.row{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:14px}
label.row input,label.row select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:42px}
label.row input:focus,label.row select:focus{outline:2px solid var(--green);border-color:var(--green)}
label.row.check{flex-direction:row;align-items:center;gap:10px}
label.row.check input{width:22px;height:22px;min-height:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.btn{font:inherit;border:1px solid var(--green-dark);background:var(--green-soft);color:var(--green-ink);border-radius:8px;padding:8px 12px;cursor:pointer}

dl.nums dd.minor{font-size:12px;font-weight:400;color:var(--muted)}

details.flags summary{color:var(--caution)}
details ul{margin:6px 0 0;padding-left:18px;font-size:14px}
details li{margin:4px 0}

.refs{padding-left:18px;font-size:14px} .refs li{margin:6px 0}

.authority .fil{color:var(--earth)}
.locnote{font-size:13px;margin:6px 0;color:var(--earth);font-weight:600}
.lochint{font-size:12px;margin:4px 0 8px;color:var(--muted)}
.opt{font-size:12px;color:var(--muted);font-weight:400;margin-left:.35em}
.opt.pre{color:var(--earth)}
.opt .fil{font-style:italic}
.locwarn{font-size:13px;margin:8px 0 0}
.locacc{font-size:12px;margin:8px 0 0;color:var(--muted)}
dl.nums dt.alert{color:#8a4b00;font-weight:700}
dl.nums dd.alert{font-size:14px;font-weight:400;padding:8px 10px;border-left:4px solid #d98324;background:#fdf3e6;border-radius:6px}

<header>

<script>
/* =====================================================================
   AgriKalkunahon core - agricultural meteorology decision engine
   Every constant is traceable to a cited source. See REFS at bottom.
   Numbers only: this file returns codes, values and source ids;
   the interface turns codes into words (English and Filipino).
   Copyright 2026 Jef Zerrudo. PolyForm Noncommercial License 1.0.0
   ===================================================================== */
(function (root) {
'use strict';

const isNum = v => typeof v === 'number' && isFinite(v);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = d => d * Math.PI / 180;
const round = (v, n) => { const f = Math.pow(10, n); return Math.round(v * f) / f; };

/* =====================================================================
   1. PSYCHROMETRICS AND ATMOSPHERE  (FAO-56 Chapter 3)           [FAO56]
   ===================================================================== */
/* Eq. 7  atmospheric pressure from elevation, kPa (ideal gas, 20 C standard atmosphere) */
function pressure(z) { return 101.3 * Math.pow((293 - 0.0065 * z) / 293, 5.26); }
/* Eq. 8  psychrometric constant, kPa/C  (lambda 2.45, cp 1.013e-3, eps 0.622 -> 0.665e-3) */
function gamma(P) { return 0.665e-3 * P; }
/* Eq. 11 saturation vapour pressure at T, kPa */
function es0(T) { return 0.6108 * Math.exp(17.27 * T / (T + 237.3)); }
/* Eq. 12 mean saturation vapour pressure of a day/period from Tmax and Tmin */
function esMean(Tmax, Tmin) { return (es0(Tmax) + es0(Tmin)) / 2; }
/* Eq. 13 slope of the saturation vapour pressure curve at T, kPa/C */
function slope(T) { return 4098 * es0(T) / Math.pow(T + 237.3, 2); }
/* Eq. 14 actual vapour pressure from dew point */
function eaFromTdew(Tdew) { return es0(Tdew); }
/* inverse of Eq. 11 (exact algebra): dew point from actual vapour pressure */
function tdewFromEa(ea) { const l = Math.log(ea / 0.6108); return 237.3 * l / (17.27 - l); }
/* Eq. 15, 16 actual vapour pressure from dry and wet bulb; apsy by ventilation type */
const APSY = { ventilated: 0.000662, natural: 0.000800, indoor: 0.001200 };
function eaFromWetBulb(Twet, Tdry, P, apsy) { return es0(Twet) - (apsy || APSY.ventilated) * P * (Tdry - Twet); }
/* Eq. 17, 18, 19 actual vapour pressure from relative humidity */
function eaFromRH(Tmin, Tmax, RHmax, RHmin) { return (es0(Tmin) * RHmax / 100 + es0(Tmax) * RHmin / 100) / 2; }
function eaFromRHmax(Tmin, RHmax) { return es0(Tmin) * RHmax / 100; }
function eaFromRHmean(Tmin, Tmax, RHmean) { return esMean(Tmax, Tmin) * RHmean / 100; }
/* Eq. 48 missing humidity: Tdew ~ Tmin (humid and subhumid climates; arid: subtract 2-3 C) */
function eaFromTmin(Tmin, aridOffset) { return es0(Tmin - (aridOffset || 0)); }
/* wet-bulb temperature by bisection on Eq. 15 (ventilated psychrometer constant) */
function wetBulb(T, RH, P, apsy) {
  if (!isNum(T) || !isNum(RH) || RH <= 0 || RH > 100) return NaN;
  const ea = es0(T) * RH / 100, a = apsy || APSY.ventilated;
  let lo = tdewFromEa(ea), hi = T;
  if (RH >= 100) return T;
  for (let i = 0; i < 60; i++) {
    const m = 0.5 * (lo + hi);
    const f = es0(m) - a * P * (T - m) - ea;
    if (f > 0) hi = m; else lo = m;
  }
  return 0.5 * (lo + hi);
}
function deltaT(T, RH, P) { return T - wetBulb(T, RH, P); }
function rhFromTdew(T, Tdew) { return 100 * es0(Tdew) / es0(T); }

/* =====================================================================
   2. RADIATION AND DAY LENGTH  (FAO-56 Chapter 3)                [FAO56]
   ===================================================================== */
const GSC = 0.0820;                 // solar constant, MJ m-2 min-1
const SIGMA = 4.903e-9;             // Stefan-Boltzmann, MJ K-4 m-2 day-1
const ALBEDO = 0.23;                // grass reference
const AS = 0.25, BS = 0.50;         // Angstrom, Eq. 35 defaults
const KRS = { interior: 0.16, coastal: 0.19 };   // Eq. 50
const MJ_TO_MM = 0.408;             // Eq. 20

function dayOfYear(y, m, d) {       // m 1..12 ; FAO-56 Annex 2 Table 2.5 counts 1 Jan = 1
  const a = Date.UTC(y, m - 1, d), b = Date.UTC(y, 0, 1);
  return Math.round((a - b) / 86400000) + 1;
}
function invRelDist(J) { return 1 + 0.033 * Math.cos(2 * Math.PI * J / 365); }          // Eq. 23
function declination(J) { return 0.409 * Math.sin(2 * Math.PI * J / 365 - 1.39); }      // Eq. 24
function sunsetAngle(phi, delta) {                                                         // Eq. 25
  const x = -Math.tan(phi) * Math.tan(delta);
  return Math.acos(clamp(x, -1, 1));
}
/* Eq. 21 extraterrestrial radiation, MJ m-2 day-1 */
function Ra(latDeg, J) {
  const phi = rad(latDeg), dr = invRelDist(J), d = declination(J), ws = sunsetAngle(phi, d);
  return 24 * 60 / Math.PI * GSC * dr * (ws * Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.sin(ws));
}
/* Eq. 34 daylight hours */
function daylight(latDeg, J) { return 24 / Math.PI * sunsetAngle(rad(latDeg), declination(J)); }
/* Eq. 35 solar radiation from sunshine hours */
function RsAngstrom(n, N, ra, as, bs) { return ((as == null ? AS : as) + (bs == null ? BS : bs) * n / N) * ra; }
/* Eq. 36 / 37 clear-sky radiation */
function Rso(z, ra, as, bs) { return (as != null && bs != null) ? (as + bs) * ra : (0.75 + 2e-5 * z) * ra; }
/* Eq. 38 net shortwave */
function Rns(rs) { return (1 - ALBEDO) * rs; }
/* Eq. 39 net longwave (Rs/Rso limited to 1) */
function Rnl(Tmax, Tmin, ea, rs, rso) {
  const r = clamp(rs / rso, 0, 1);
  return SIGMA * (Math.pow(Tmax + 273.16, 4) + Math.pow(Tmin + 273.16, 4)) / 2 * (0.34 - 0.14 * Math.sqrt(ea)) * (1.35 * r - 0.35);
}
/* Eq. 50 Hargreaves radiation formula; Eq. 51 island relation (monthly only, 0-100 m) */
function RsFromTemp(Tmax, Tmin, ra, kRs) { return (kRs || KRS.coastal) * Math.sqrt(Math.max(0, Tmax - Tmin)) * ra; }
function RsIsland(ra) { return 0.7 * ra - 4; }
/* Eq. 43, 44 monthly soil heat flux */
function Gmonth(Ti, Tprev, Tnext) { return isNum(Tnext) ? 0.07 * (Tnext - Tprev) : 0.14 * (Ti - Tprev); }
/* Eq. 47 wind at 2 m from height z */
function u2FromHeight(uz, z) { return z === 2 ? uz : uz * 4.87 / Math.log(67.8 * z - 5.42); }

/* Sunrise and sunset in local clock time from FAO-56 Eq. 31-33 (Lz, Lm in degrees WEST of Greenwich).
   For the Philippines Lz = 240 (UTC+8) and Lm = 360 - longitude(E). Returns hours, decimal. */
function seasonalCorrection(J) {
  const b = 2 * Math.PI * (J - 81) / 364;                                                    // Eq. 33
  return 0.1645 * Math.sin(2 * b) - 0.1255 * Math.cos(b) - 0.025 * Math.sin(b);              // Eq. 32
}
function sunTimes(latDeg, lonEastDeg, J, utcOffsetHours) {
  const Lz = (360 - 15 * (utcOffsetHours == null ? 8 : utcOffsetHours)) % 360;
  const Lm = (360 - lonEastDeg) % 360;
  const ws = sunsetAngle(rad(latDeg), declination(J));
  const Sc = seasonalCorrection(J);
  const noon = 12 - 0.06667 * (Lz - Lm) - Sc;            // omega = 0 (Eq. 31 solved for t)
  const half = ws * 12 / Math.PI;
  return { sunrise: noon - half, sunset: noon + half, noon: noon, daylight: 2 * half };
}

/* =====================================================================
   3. REFERENCE EVAPOTRANSPIRATION  (FAO-56 Chapter 4)             [FAO56]
   ===================================================================== */
/* Eq. 6 FAO Penman-Monteith, daily or monthly means. All inputs already resolved. */
function etoPM(Tmax, Tmin, ea, Rn, G, u2, z) {
  const T = (Tmax + Tmin) / 2, D = slope(T), g = gamma(pressure(z)), es = esMean(Tmax, Tmin);
  const u = Math.max(u2, 0.5);      // FAO-56: "u2 should be limited to about u2 >= 0.5 m/s"
  return (0.408 * D * (Rn - G) + g * 900 / (T + 273) * u * (es - ea)) / (D + g * (1 + 0.34 * u));
}
/* Eq. 52 Hargreaves (Ra in MJ m-2 day-1 here; converted to mm inside) */
function etoHargreaves(Tmax, Tmin, ra) { return 0.0023 * ((Tmax + Tmin) / 2 + 17.8) * Math.sqrt(Math.max(0, Tmax - Tmin)) * MJ_TO_MM * ra; }

/* Resolve inputs with FAO-56's documented fallbacks and compute ETo.
   inp: { Tmax, Tmin, lat, elev, J, [RHmax, RHmin, RHmean, Tdew, Twet, ea], [u2 | uz+zWind], [Rs | n],
          site: 'coastal'|'interior'|'island', monthly: bool, Tprev, Tnext, arid: bool }
   Returns numbers, fallback codes and flags. */
function eto(inp) {
  const f = [], flags = [];
  const Tmax = inp.Tmax, Tmin = inp.Tmin;
  if (!isNum(Tmax) || !isNum(Tmin)) return { error: 'need_tmax_tmin' };
  if (Tmax < Tmin) return { error: 'tmax_below_tmin' };
  const z = isNum(inp.elev) ? inp.elev : 0, P = pressure(z);
  // humidity
  let ea, eaMethod;
  if (isNum(inp.ea)) { ea = inp.ea; eaMethod = 'ea_given'; }
  else if (isNum(inp.Tdew)) { ea = eaFromTdew(inp.Tdew); eaMethod = 'eq14_tdew'; }
  else if (isNum(inp.Twet) && isNum(inp.Tdry)) { ea = eaFromWetBulb(inp.Twet, inp.Tdry, P, inp.apsy); eaMethod = 'eq15_wetbulb'; }
  else if (isNum(inp.RHmax) && isNum(inp.RHmin)) { ea = eaFromRH(Tmin, Tmax, inp.RHmax, inp.RHmin); eaMethod = 'eq17_rhmaxmin'; }
  else if (isNum(inp.RHmax)) { ea = eaFromRHmax(Tmin, inp.RHmax); eaMethod = 'eq18_rhmax'; }
  else if (isNum(inp.RHmean)) { ea = eaFromRHmean(Tmin, Tmax, inp.RHmean); eaMethod = 'eq19_rhmean'; flags.push('eq19_less_desirable'); }
  else { ea = eaFromTmin(Tmin, inp.arid ? 2 : 0); eaMethod = 'eq48_tdew_eq_tmin'; f.push('humidity_from_tmin'); }
  const es = esMean(Tmax, Tmin);
  if (ea > es) { ea = es; flags.push('ea_capped_at_es'); }
  // radiation
  const ra = Ra(inp.lat, inp.J), N = daylight(inp.lat, inp.J);
  let rs, rsMethod;
  const rso = Rso(z, ra);
  if (isNum(inp.Rs)) { rs = inp.Rs; rsMethod = 'rs_measured'; }
  else if (isNum(inp.n)) {
    // Sunshine cannot be negative, nor exceed the daylight hours N. Clamping is right, but say so:
    // every other clamp in this function reports itself, and a farmer who typed minutes instead of
    // hours should not get an answer quietly computed from a different number.
    if (inp.n < 0 || inp.n > N) flags.push('sunshine_clamped_0_N');
    rs = RsAngstrom(clamp(inp.n, 0, N), N, ra); rsMethod = 'eq35_sunshine';
  }
  else if (inp.site === 'island') {
    rs = RsIsland(ra); rsMethod = 'eq51_island'; f.push('radiation_island_monthly');
    if (!inp.monthly) flags.push('eq51_monthly_only');
    if (z > 100) flags.push('eq51_altitude_limit');
  } else {
    const k = inp.site === 'interior' ? KRS.interior : KRS.coastal;
    rs = RsFromTemp(Tmax, Tmin, ra, k); rsMethod = 'eq50_temperature_range'; f.push('radiation_from_temperature');
    if (!inp.monthly) flags.push('eq50_average_over_days');
  }
  if (rs > rso) { rs = rso; flags.push('rs_capped_at_rso'); }
  const rns = Rns(rs), rnl = Rnl(Tmax, Tmin, ea, rs, rso), rn = rns - rnl;
  // soil heat flux
  let G = 0;
  if (inp.monthly && isNum(inp.Tprev)) G = Gmonth((Tmax + Tmin) / 2, inp.Tprev, inp.Tnext);
  // wind
  let u2, windMethod;
  if (isNum(inp.u2)) { u2 = inp.u2; windMethod = 'u2_given'; }
  else if (isNum(inp.uz) && isNum(inp.zWind)) { u2 = u2FromHeight(inp.uz, inp.zWind); windMethod = 'eq47_height_adjusted'; }
  else { u2 = 2.0; windMethod = 'table4_default_2ms'; f.push('wind_default_2ms'); }
  if (u2 < 0.5) flags.push('u2_floor_0_5');
  const value = etoPM(Tmax, Tmin, ea, rn, G, u2, z);
  const harg = etoHargreaves(Tmax, Tmin, ra);
  return {
    eto: value, hargreaves: harg, P: P, ea: ea, es: es, ra: ra, N: N, rs: rs, rso: rso, rns: rns, rnl: rnl, rn: rn, G: G, u2: u2,
    methods: { ea: eaMethod, rs: rsMethod, wind: windMethod }, fallbacks: f, flags: flags,
    // FAO-56 Example 20 sensitivity of the wind default: about -7% at 1 m/s, +6% at 3 m/s
    windSensitivity: windMethod === 'table4_default_2ms' ? { u1: etoPM(Tmax, Tmin, ea, rn, G, 1, z), u3: etoPM(Tmax, Tmin, ea, rn, G, 3, z) } : null,
    sources: ['FAO56']
  };
}

/* Table 14: Kc ini for paddy rice by humidity and wind class */
const RICE_KC_INI = { arid: { light: 1.10, moderate: 1.15, strong: 1.20 }, subhumid: { light: 1.05, moderate: 1.10, strong: 1.15 }, veryhumid: { light: 1.00, moderate: 1.05, strong: 1.10 } };
/* Table 16: RHmin typical of climate classes (used only when RHmin cannot be estimated) */
const RHMIN_CLASS = { arid: 20, semiarid: 30, subhumid: 45, humid: 70, veryhumid: 80 };
/* Table 15 / Table 4 representative wind speeds for the classes */
const WIND_CLASS_MS = { light: 1.0, lightmoderate: 2.0, moderatestrong: 4.0, strong: 5.0 };

/* Eq. 64 RHmin estimated from Tmin (as Tdew) and Tmax */
function rhMinFromTemps(Tmin, Tmax, aridOffset) { return 100 * es0(Tmin - (aridOffset || 0)) / es0(Tmax); }
/* Eq. 62 / 65 climate adjustment. Returns adjusted Kc and the clamp flags. */
function kcAdjust(kcTab, u2, RHmin, h, isEnd) {
  const flags = [];
  if (isEnd && kcTab < 0.45) return { kc: kcTab, flags: ['kc_end_below_0_45_no_adjust'] };
  if (h < 0.1) return { kc: kcTab, flags: ['h_below_0_1_no_adjust'] };
  let u = u2, r = RHmin, hh = h;
  if (u < 1 || u > 6) { u = clamp(u, 1, 6); flags.push('u2_clamped_1_6'); }
  if (r < 20 || r > 80) { r = clamp(r, 20, 80); flags.push('rhmin_clamped_20_80'); }
  if (hh > 10) { hh = 10; flags.push('h_clamped_10'); }
  return { kc: kcTab + (0.04 * (u - 2) - 0.004 * (r - 45)) * Math.pow(hh / 3, 0.3), flags: flags };
}
/* Eq. 66 Kc on day i (1-based) of the season for stage lengths L = [Lini, Ldev, Lmid, Llate] */
function kcOnDay(i, L, kIni, kMid, kEnd) {
  const [a, b, c, d] = L;
  if (i <= a) return kIni;
  if (i <= a + b) return kIni + (i - a) / b * (kMid - kIni);
  if (i <= a + b + c) return kMid;
  if (i <= a + b + c + d) return kMid + (i - (a + b + c)) / d * (kEnd - kMid);
  return kEnd;
}
function stageOnDay(i, L) {
  const [a, b, c, d] = L;
  if (i <= a) return 'initial'; if (i <= a + b) return 'development'; if (i <= a + b + c) return 'mid'; if (i <= a + b + c + d) return 'late'; return 'after';
}
/* Build the three Kc values for a crop under the site climate. opts: {u2, RHmin, Tmin, Tmax, riceHumidity, riceWind, kcEndChoice} */
function cropKc(cropId, opts) {
  const c = CROPS[cropId]; if (!c) return { error: 'unknown_crop' };
  const o = opts || {};
  const u2 = isNum(o.u2) ? o.u2 : 2.0;
  let RHmin = isNum(o.RHmin) ? o.RHmin : (isNum(o.Tmin) && isNum(o.Tmax) ? rhMinFromTemps(o.Tmin, o.Tmax) : 45);
  const flags = [];
  if (!isNum(o.RHmin) && !(isNum(o.Tmin) && isNum(o.Tmax))) flags.push('rhmin_default_45');
  let kIni = c.kcIni;
  if (cropId === 'rice') { kIni = RICE_KC_INI[o.riceHumidity || 'subhumid'][o.riceWind || 'moderate']; }
  else if (c.kcIniGroup) flags.push('kc_ini_is_group_value');
  const mid = kcAdjust(c.kcMid, u2, RHmin, c.h, false);
  const endTab = c.kcEnd[o.kcEndChoice || 0];
  const end = kcAdjust(endTab, u2, RHmin, c.h, true);
  return { kcIni: kIni, kcMid: mid.kc, kcEnd: end.kc, kcMidTab: c.kcMid, kcEndTab: endTab, RHmin: RHmin, u2: u2, h: c.h,
           flags: flags.concat(mid.flags, end.flags), sources: ['FAO56'] };
}

/* =====================================================================
   5. SOIL WATER BALANCE  (FAO-56 Chapter 8, Table 19)             [FAO56]
   ===================================================================== */
/* Table 19 ranges; mid is the midpoint used as the editable default */
const SOILS = {
  sand:          { fc: [0.07, 0.17], wp: [0.02, 0.07] },
  loamy_sand:    { fc: [0.11, 0.19], wp: [0.03, 0.10] },
  sandy_loam:    { fc: [0.18, 0.28], wp: [0.06, 0.16] },
  loam:          { fc: [0.20, 0.30], wp: [0.07, 0.17] },
  silt_loam:     { fc: [0.22, 0.36], wp: [0.09, 0.21] },
  silt:          { fc: [0.28, 0.36], wp: [0.12, 0.22] },
  silt_clay_loam:{ fc: [0.30, 0.37], wp: [0.17, 0.24] },
  silty_clay:    { fc: [0.30, 0.42], wp: [0.17, 0.29] },
  clay:          { fc: [0.32, 0.40], wp: [0.20, 0.24] }
};
function soilMid(id) { const s = SOILS[id]; return s ? { fc: (s.fc[0] + s.fc[1]) / 2, wp: (s.wp[0] + s.wp[1]) / 2 } : null; }
function TAW(fc, wp, zr) { return 1000 * (fc - wp) * zr; }                 // Eq. 82
function RAW(p, taw) { return p * taw; }                                     // Eq. 83
function pAdjust(pTab, ETc) { return clamp(pTab + 0.04 * (5 - ETc), 0.1, 0.8); }
function Ks(Dr, taw, p) { const raw = p * taw; return Dr <= raw ? 1 : Math.max(0, (taw - Dr) / ((1 - p) * taw)); }   // Eq. 84
/* Daily balance, Eq. 85-88. days: [{eto, kc, rain, irrig, ro}], from Dr0. Rain below 0.2 ETo ignored (FAO-56). */
function waterBalance(days, taw, p, Dr0, opts) {
  const o = opts || {};
  let Dr = clamp(isNum(Dr0) ? Dr0 : 0, 0, taw);
  const out = [];
  for (const d of days) {
    const etc = d.eto * d.kc;
    const pUse = o.adjustP ? pAdjust(p, etc) : p;
    const raw = pUse * taw;
    let rain = d.rain || 0;
    if (rain < 0.2 * d.eto) rain = 0;
    const irrig = d.irrig || 0, ro = d.ro || 0;
    const DrStart = Math.max(0, Dr - irrig - (rain - ro));   // wetting early in the day (FAO-56 Ex. 38, note 5)
    const ks = Ks(DrStart, taw, pUse);
    const etcAdj = etc * ks;
    const dp = Math.max(0, (rain - ro) + irrig - etcAdj - Dr);   // Eq. 88 deep percolation
    const DrEnd = clamp(DrStart + etcAdj, 0, taw);
    out.push({ etc: etc, ks: ks, etcAdj: etcAdj, raw: raw, p: pUse, DrStart: DrStart, DrEnd: DrEnd, dp: dp, rainUsed: rain });
    Dr = DrEnd;
  }
  return out;
}
/* Irrigation decision from a stateless ledger since the last thorough wetting.
   inp: {fc, wp, zr, p, etoPerDay (number or array), kc, daysSinceWet, rains:[{day, mm}], irrigs:[{day, mm}], efficiency, areaHa, pumpLs, adjustP}
   Returns Dr, RAW, verdict code, net and gross depths, volumes, days until RAW is reached. */
function irrigationDecision(inp) {
  const taw = TAW(inp.fc, inp.wp, inp.zr);
  const n = Math.max(0, Math.round(inp.daysSinceWet));
  const days = [];
  for (let i = 1; i <= n; i++) {
    const eto = Array.isArray(inp.etoPerDay) ? inp.etoPerDay[Math.min(i - 1, inp.etoPerDay.length - 1)] : inp.etoPerDay;
    const kc = Array.isArray(inp.kc) ? inp.kc[Math.min(i - 1, inp.kc.length - 1)] : inp.kc;
    const rain = (inp.rains || []).filter(r => r.day === i).reduce((a, r) => a + r.mm, 0);
    const irrig = (inp.irrigs || []).filter(r => r.day === i).reduce((a, r) => a + r.mm, 0);
    days.push({ eto: eto, kc: kc, rain: rain, irrig: irrig });
  }
  const traj = waterBalance(days, taw, inp.p, 0, { adjustP: inp.adjustP !== false });
  const last = traj.length ? traj[traj.length - 1] : null;
  const Dr = last ? last.DrEnd : 0;
  const etoNow = Array.isArray(inp.etoPerDay) ? inp.etoPerDay[inp.etoPerDay.length - 1] : inp.etoPerDay;
  const kcNow = Array.isArray(inp.kc) ? inp.kc[inp.kc.length - 1] : inp.kc;
  const etcNow = etoNow * kcNow;
  const pUse = inp.adjustP !== false ? pAdjust(inp.p, etcNow) : inp.p;
  const raw = RAW(pUse, taw);
  const eff = isNum(inp.efficiency) ? inp.efficiency : 1;
  const net = Dr, gross = net / eff;
  const area = isNum(inp.areaHa) ? inp.areaHa : 1;
  const m3 = gross * 10 * area;                       // 1 mm over 1 ha = 10 m3
  const litres = m3 * 1000;
  const pumpHours = isNum(inp.pumpLs) && inp.pumpLs > 0 ? litres / (inp.pumpLs * 3600) : null;
  const stressed = traj.some(t => t.ks < 1);
  let code, daysToRaw = 0;
  if (Dr >= raw) code = 'water_now';
  else { daysToRaw = (raw - Dr) / etcNow; code = daysToRaw < 1 ? 'water_tomorrow' : 'wait'; }
  return { code: code, Dr: Dr, taw: taw, raw: raw, p: pUse, etc: etcNow, daysToRaw: daysToRaw, netMm: net, grossMm: gross, m3: m3, litres: litres,
           pumpHours: pumpHours, stressBegun: stressed, trajectory: traj, sources: ['FAO56', 'FAO_TM4'] };
}

/* =====================================================================
   6. LOWLAND RICE: SAFE AWD AND CONTINUOUS FLOODING  [IRRI_AWD, BOUMAN2007, DA_AO25, PHILRICE_AWD, PALAYCHECK]
   ===================================================================== */
const AWD = {
  triggerCm: { dry: 15, wet: 20 },          // DA AO 25-09; PhilRice observation well (IRRI: 15 cm all season)
  refloodCm: 5,                              // IRRI RKB, Bouman 2007, PhilRice
  startDays: [21, 30],                       // PhilRice: 21-30 days after transplanting or sowing (IRRI: 1-2 weeks)
  floweringFloodCm: 5,                       // IRRI, PhilRice (PalayCheck: 5-7 cm)
  floweringWindowDays: 7,                    // one week before to one week after flowering (IRRI, Bouman)
  drainBeforeHarvestDays: { light: 7, clay: 14 },   // PhilRice, PalayCheck
  preAwdDepthCm: [2, 3],                     // PhilRice (Saludez 2022): 2-3 cm before AWD starts
  continuous: { afterTransplantCm: 3, laterCm: [5, 10], drainBeforeHarvestDays: [7, 10], headingCm: 5 },  // IRRI RKB, verbatim
  /* IRRI fact sheet: the tube is 30 cm of plastic pipe or bamboo, 10-15 cm across, hammered in so 15 cm
     stands above the soil. Quoted on the card, because a farmer without one can make one in an hour. */
  tube: { lengthCm: 30, diameterCm: [10, 15], aboveSoilCm: 15 },
  weedPostponeWeeks: [2, 3]
};
/* CONTINUOUS FLOODING  [IRRI_AWD]. Depths from the IRRI Rice Knowledge Bank: "around 3 cm initially",
   "gradually increase to 5-10 cm (with increasing plant height)", 5 cm "from heading to the end of
   flowering", "drained 7-10 days before harvest". */
function continuousFloodDecision(inp) {
  const C = AWD.continuous, src = ['IRRI_AWD', 'PALAYCHECK'];
  const d = C.drainBeforeHarvestDays;
  if (isNum(inp.daysToHarvest) && inp.daysToHarvest <= d[1]) return { code: 'cf_drain_now', drainDays: d, sources: src };
  if (isNum(inp.daysToFlowering) && Math.abs(inp.daysToFlowering) <= AWD.floweringWindowDays) {
    const ok = isNum(inp.pondedCm) && inp.pondedCm >= C.headingCm;
    return { code: ok ? 'cf_flowering_ok' : 'cf_flowering_top_up', targetCm: C.headingCm, sources: src };
  }
  const early = isNum(inp.daysAfterEstablish) && inp.daysAfterEstablish < AWD.startDays[0];
  const target = early ? [C.afterTransplantCm, C.afterTransplantCm] : C.laterCm;
  if (!isNum(inp.pondedCm)) return { code: 'cf_need_depth', targetCm: target, sources: src };
  if (inp.pondedCm < target[0]) return { code: 'cf_top_up', targetCm: target, shortCm: target[0] - inp.pondedCm, sources: src };
  if (inp.pondedCm > target[1] + 5) return { code: 'cf_too_deep', targetCm: target, sources: src };
  return { code: 'cf_ok', targetCm: target, sources: src };
}
/* INTERMITTENT DRYING WITHOUT A TUBE  [IRRI_AWD]. Returns no dry-down threshold, deliberately. Safe AWD
   is defined by reading the water table in a tube; the IRRI fact sheet gives no guidance for a farmer
   without one, and this app does not invent one. What it does return is what holds whatever the method:
   flooded through flowering, drained before harvest, postponed while weeds are unmanaged. */
function intermittentDecision(inp) {
  const src = ['IRRI_AWD', 'PALAYCHECK'], flags = ['no_tube_no_published_threshold'];
  const drainDays = AWD.drainBeforeHarvestDays[inp.soil === 'clay' ? 'clay' : 'light'];
  if (inp.weedsManaged === false) flags.push('postpone_awd_weeds');
  if (isNum(inp.daysToHarvest) && inp.daysToHarvest <= drainDays) return { code: 'drain_stop_irrigating', drainDays: drainDays, flags: flags, tube: AWD.tube, sources: src };
  if (isNum(inp.daysToFlowering) && Math.abs(inp.daysToFlowering) <= AWD.floweringWindowDays) {
    const ok = isNum(inp.pondedCm) && inp.pondedCm >= AWD.floweringFloodCm;
    return { code: ok ? 'flowering_keep_flooded' : 'flowering_top_up_to_5cm', targetCm: AWD.floweringFloodCm, flags: flags, tube: AWD.tube, sources: src };
  }
  if (isNum(inp.daysAfterEstablish) && inp.daysAfterEstablish < AWD.startDays[0]) return { code: 'before_awd_keep_shallow', depthCm: AWD.preAwdDepthCm, flags: flags, tube: AWD.tube, sources: src };
  return { code: 'intermittent_no_threshold', flags: flags, tube: AWD.tube, sources: src };   // no triggerCm: there is none to give
}
/* Dispatch on the farmer's chosen method. */
function riceWaterDecision(inp) {
  if (inp.method === 'continuous') return continuousFloodDecision(inp);
  if (inp.method === 'intermittent') return intermittentDecision(inp);
  return awdDecision(inp);
}
/* inp: {daysAfterEstablish, daysToFlowering (negative after), daysToHarvest, season:'wet'|'dry', tubeBelowSurfaceCm (positive = below), pondedCm, weedsManaged, soil:'light'|'clay', pondDropCmPerDay} */
function awdDecision(inp) {
  const flags = [], src = ['IRRI_AWD', 'BOUMAN2007', 'DA_AO25', 'PHILRICE_AWD', 'PALAYCHECK'];
  const trig = AWD.triggerCm[inp.season === 'wet' ? 'wet' : 'dry'];
  const drainDays = AWD.drainBeforeHarvestDays[inp.soil === 'clay' ? 'clay' : 'light'];
  if (isNum(inp.daysToHarvest) && inp.daysToHarvest <= drainDays) return { code: 'drain_stop_irrigating', drainDays: drainDays, sources: src };
  if (isNum(inp.daysToFlowering) && Math.abs(inp.daysToFlowering) <= AWD.floweringWindowDays) {
    const ok = isNum(inp.pondedCm) && inp.pondedCm >= AWD.floweringFloodCm;
    return { code: ok ? 'flowering_keep_flooded' : 'flowering_top_up_to_5cm', targetCm: AWD.floweringFloodCm, sources: src };
  }
  if (isNum(inp.daysAfterEstablish) && inp.daysAfterEstablish < AWD.startDays[0]) return { code: 'before_awd_keep_shallow', depthCm: AWD.preAwdDepthCm, sources: src };
  if (inp.weedsManaged === false) { flags.push('postpone_awd_weeds'); }
  const reading = inp.tubeBelowSurfaceCm;
  if (!isNum(reading)) return { code: 'need_tube_reading', triggerCm: trig, flags: flags, sources: src };
  if (reading >= trig) return { code: 'reflood_now', triggerCm: trig, refloodCm: AWD.refloodCm, flags: flags, sources: src };
  let daysLeft = null;
  if (isNum(inp.pondDropCmPerDay) && inp.pondDropCmPerDay > 0) daysLeft = (trig - reading) / inp.pondDropCmPerDay;
  return { code: 'not_yet', triggerCm: trig, remainingCm: trig - reading, daysLeft: daysLeft, flags: flags, sources: src };
}

/* =====================================================================
   7. EFFECTIVE RAINFALL (monthly planning)  [FAO_TM3]
   ===================================================================== */
function effectiveRainMonthly(P) { if (!isNum(P) || P <= 0) return 0; return Math.max(0, P > 75 ? 0.8 * P - 25 : 0.6 * P - 10); }

/* =====================================================================
   8. SPRAY WINDOW  [GRDC2025, GRDC2022, GRDC_MANUAL, APVMA_LABEL, AGVIC]
   ===================================================================== */
const SPRAY = {
  deltaT: { good: [2, 8], caution: [8, 10], veryCoarseOnly: [10, 12] },  // GRDC Practical tips 2025
  windKmh: { good: [3, 15], variableBelow: 5, labelMax: 20 },           // BOM/AgVic/APVMA 3-15; GRDC 2022 warns below 5; label up to 20
  inversionNightWindKmh: 11,                                            // GRDC: hazardous inversions likely below 11 km/h at night
  inversionBeforeSunsetH: 2, inversionAfterSunriseH: 2,                 // APVMA label: 1-2 h before sunset until 1-2 h after sunrise
  maxAirTempC: 30                                                       // GRDC Weather essentials 2022
};
/* inp: {T, RH, P, windKmh, hoursToSunset, hoursAfterSunrise, mistFogDew, smokeHanging, labelMaxWindKmh} */
function sprayWindow(inp) {
  const reasons = [], src = ['GRDC2025', 'GRDC2022', 'GRDC_MANUAL', 'APVMA_LABEL', 'AGVIC'];
  const P = isNum(inp.P) ? inp.P : 101.3;
  const dT = deltaT(inp.T, inp.RH, P);
  let level = 0;   // 0 good, 1 caution, 2 do not spray
  // Delta T bands (GRDC 2025)
  let dtBand;
  if (dT < 2) { dtBand = 'below_2'; level = Math.max(level, 1); reasons.push('deltaT_below_2'); }
  else if (dT <= 8) dtBand = 'good';
  else if (dT <= 10) { dtBand = 'caution'; level = Math.max(level, 1); reasons.push('deltaT_8_10'); }
  else if (dT <= 12) { dtBand = 'very_coarse_only'; level = Math.max(level, 1); reasons.push('deltaT_10_12'); }
  else { dtBand = 'above_12'; level = 2; reasons.push('deltaT_above_12'); }
  // wind
  const w = inp.windKmh, maxW = isNum(inp.labelMaxWindKmh) ? clamp(inp.labelMaxWindKmh, 15, 20) : 15;
  if (isNum(w)) {
    if (w < 3) { level = 2; reasons.push('wind_below_3'); }
    else if (w < SPRAY.windKmh.variableBelow) { level = Math.max(level, 1); reasons.push('wind_3_5_variable'); }
    if (w > maxW) { level = 2; reasons.push('wind_above_max'); }
  } else reasons.push('wind_unknown');
  // Wind is the primary drift criterion in every label and in the GRDC bands. Without it the card
  // reports that it cannot answer, rather than showing a green light it has no basis for.
  const windUnknown = !isNum(w);
  // inversion window and indicators
  const night = (isNum(inp.hoursToSunset) && inp.hoursToSunset <= SPRAY.inversionBeforeSunsetH) || (isNum(inp.hoursAfterSunrise) && inp.hoursAfterSunrise <= SPRAY.inversionAfterSunriseH) || inp.isNight === true;
  if (night) {
    if (!isNum(w) || w < SPRAY.inversionNightWindKmh) { level = 2; reasons.push('inversion_window'); }
    else { level = Math.max(level, 1); reasons.push('inversion_window_windy'); }
  }
  if (inp.mistFogDew || inp.smokeHanging) { level = 2; reasons.push('inversion_indicators'); }
  // temperature
  if (inp.T > SPRAY.maxAirTempC) { level = Math.max(level, 1); reasons.push('temp_above_30'); }
  const code = (windUnknown && level < 2) ? 'need_wind' : ['good', 'caution', 'do_not_spray'][level];
  return { code: code, deltaT: dT, deltaTBand: dtBand, wetBulb: inp.T - dT, reasons: reasons, sources: src };
}

/* =====================================================================
   9. PALAY DRYING  [ASABE_D245_ZHONG, UAEX_FSA1074, IRRI_DRYING, PALAYCHECK]
   ===================================================================== */
/* Modified Henderson, ASABE D245.6 long-grain rough rice constants as reproduced by Zhong (2015),
   corroborated against the University of Arkansas EMC table (FSA1074) to 0.05 points. M in % dry basis. */
const EMC_HENDERSON_LONG_ROUGH = { A: 4.1276e-5, B: 2.1191, C: 49.828 };
function emcDryBasis(T, RH) {   // RH in percent
  const k = EMC_HENDERSON_LONG_ROUGH, r = clamp(RH, 0.5, 99.9) / 100;

function rhForMoisture(T, targetWb) {
  let lo = 1, hi = 99;
  for (let i = 0; i < 60; i++) { const m = 0.5 * (lo + hi); if (emcWetBasis(T, m) < targetWb) lo = m; else hi = m; }
  return 0.5 * (lo + hi);
}
/* IRRI mass balance: weight after drying (wet basis percentages) */
/* Mass balance on the dry matter. Only meaningful when drying, mc1 > mc2, and for real moisture
   contents: at mc 100 the whole mass is water and the answer degenerates to zero. */
function weightAfterDrying(w1, mc1, mc2) {
  if (!isNum(w1) || w1 <= 0 || !isNum(mc1) || !isNum(mc2)) return null;
  if (mc1 <= 0 || mc1 >= 100 || mc2 <= 0 || mc2 >= 100) return null;
  if (mc1 <= mc2) return null;                 // not drying; this formula would report a weight gain
  return w1 * (100 - mc1) / (100 - mc2);
}
const CAVAN_KG = 50;   // PhilRice PalayCheck 2022: "cav - cavan (usually 50kg)"
const STORAGE_MC = { weeks_to_months: 14, months_8_12: 13, seed: 12, over_1_year: 9 };   // IRRI RKB
const SUN_DRYING = { layerCm: [2, 4], stirMinutes: 30, coverAboveGrainC: 50, coverAboveGrainSeedC: 42, seedAirMaxC: 43 };   // IRRI RKB
/* inp: {T, RH, weightKg, mc, cavanKg, storage:'weeks_to_months'|'months_8_12'|'seed'|'over_1_year'} */
function dryingDecision(inp) {
  const flags = [], src = ['ASABE_D245_ZHONG', 'UAEX_FSA1074', 'IRRI_DRYING', 'PALAYCHECK'];
  if (inp.RH < 25 || inp.RH > 90) flags.push('rh_outside_corroborated_table');
  if (inp.T < 10 || inp.T > 50) flags.push('temp_outside_corroborated_range');
  const emc = emcWetBasis(inp.T, inp.RH);
  const target = STORAGE_MC[inp.storage || 'weeks_to_months'];
  const rhNeeded = rhForMoisture(inp.T, target);
  /* Palay off the field runs roughly 20-26% moisture; anything above 40 or at or below the target is
     either a typo or a crop that needs no drying, and the card says so rather than computing from it. */
  if (isNum(inp.mc) && (inp.mc <= 0 || inp.mc >= 100)) return { code: 'moisture_out_of_range', emcWb: emc, rhForTarget: rhNeeded, rhFor14: rhNeeded, storageTarget: target, weightAtTarget: null, weightAt14: null, cavansAtTarget: null, cavansAt14: null, practice: SUN_DRYING, flags: flags, sources: src };
  if (isNum(inp.mc) && inp.mc <= target) return { code: 'already_dry_enough', emcWb: emc, rhForTarget: rhNeeded, rhFor14: rhNeeded, storageTarget: target, mc: inp.mc, weightAtTarget: null, weightAt14: null, cavansAtTarget: null, cavansAt14: null, practice: SUN_DRYING, flags: flags, sources: src };
  if (isNum(inp.mc) && inp.mc > 40) flags.push('moisture_above_normal_harvest');
  const code = emc <= target ? 'can_reach_target' : 'not_assured_target';
  let w2 = null, cavans = null;
  if (isNum(inp.weightKg) && isNum(inp.mc)) {
    w2 = weightAfterDrying(inp.weightKg, inp.mc, target);
    cavans = w2 == null ? null : w2 / (isNum(inp.cavanKg) ? inp.cavanKg : CAVAN_KG);
  }
  return { code: code, emcWb: emc, rhForTarget: rhNeeded, rhFor14: rhNeeded, storageTarget: target, weightAtTarget: w2, weightAt14: w2, cavansAtTarget: cavans, cavansAt14: cavans, practice: SUN_DRYING, flags: flags, sources: src };
}

/* =====================================================================

   ===================================================================== */

  cabbage: { src: ['QDAF_CTT'], phases: { germination: { lo: 12, hi: 32 }, vegetative: { lo: 6.5, hi: 32 }, head_formation: { lo: 5, hi: 32, watch: 24 } } },

  tomato: { src: ['QDAF_CTT'], phases: { germination: { lo: 15, hi: 25 }, early_vegetative: { lo: 12, hi: 35 }, flowering: { lo: 10, hi: 27, days3: 29 }, fruit_growth: { lo: 0, hi: 32 } } },

  carrot: { src: ['QDAF_CTT'], phases: { germination: { lo: 5, hi: 35 }, vegetative: { lo: 0, hi: 35 }, root_development: { lo: 5, hi: 30 } } },
  cauliflower: { src: ['QDAF_CTT'], phases: { germination: { lo: 5, hi: 30 }, vegetative: { lo: 5, hi: 30 }, curd_induction: { lo: 20, hi: 27 }, curd_growth: { lo: 20, hi: 30 } } },

function stressCheck(cropId, phase, days) {

    else if (ph.watch != null && d.Tmax >= ph.watch) codes.push('heat_watch');

/* =====================================================================
   11. FROST INDICATOR (qualitative)  [FAO_FROST, MARASIGAN2017, BASQUIAL2021, LAUNIO2020]
   ===================================================================== */
const FROST = { dewPointLineC: 2.0 /* design assumption, stated on the card */,
  /* Marasigan (2017): 70% of MODIS-detected frost occurrences at land surface temperature at or below
     10 C, 57% at or below 9 C. A marker, not a threshold: 30% of her events were above it, her figure is
     a surface temperature rather than a screen reading, and what decides frost is how far the surface can
     radiate below the air. Comparison is 'at or below', matching the source. */

     threshold, followed by February; November has the least. Her recorded events fall in December,
     January and February. Launio et al. (2020): "Frost is known to occur from December to February",
     and farmers now expect episodes "until March". Marasigan et al. (2025) analyse November to March.

  const start = ((sunsetH - FROST.readingBeforeSunsetH) % 24 + 24) % 24;
  const end = ((sunriseH % 24) + 24) % 24;

}
/* month: 1 to 12. Returns 'peak', 'core', 'edge' or 'outside'. */
/* Where the Philippine frost record actually is. The reference point is the PAGASA Benguet
   agrometeorological station as Marasigan (2017) gives it; the elevation is her figure for Benguet.
   Frost in the Philippines is reported from the highlands, particularly Benguet (Basconcillo et al.,
   FROST-PH). No elevation threshold for frost is published, so none is applied: the card prints the
   comparison and lets the farmer see it. */

function frostIndicator(inp) {
  const td = tdewFromEa(es0(inp.T) * inp.RH / 100);
  const conds = { clear: inp.sky === 'clear', calm: inp.wind === 'calm' || inp.wind === 'light', lowDewPoint: td <= FROST.dewPointLineC, cold: inp.T <= FROST.singleDigitC, hollow: !!inp.hollow };

  // can lift at any hour, and then cooling starts. The card reports which one is holding frost off so

  // night, so an evening reading can never rule frost out, and a clear calm night returns at least
  // 'watch' however mild the thermometer reads.
  if (inp.sky === 'overcast' || inp.wind === 'breezy') {

}

/* =====================================================================
   12. DISEASE WEATHER (minimal)  [SENTELHAS2008, HUTTON]
   ===================================================================== */
/* Two things decide dew: how far the surface must cool to reach the dew point, and how fast it can.
   Cloud and wind slow the cooling, but they cannot stop a degree of it, so air already near saturation

  else if (clearCalm) code = 'dew_likely_if_cools_to_dewpoint';

}

/* PAGASA publishes Leaf Wetness in the Farm Weather Forecast as a range across the forecast area,
   alongside the temperature and humidity ranges for that same area. Reported back as given, never
   converted. It is banded against the two published figures this app has: the 6 to 8 h rice blast
   spores need to germinate (Jackson 2017) and the 9.0 to 12.8 h dew actually lasted on lowland rice
   at Los Banos (Luo & Goudriaan 2000). Banding is on the UPPER figure, because that is the worst case
   inside the forecast area and the one worth acting on. No risk score is attached to any band. */
function leafWetnessReport(loH, hiH) {
  if (!isNum(loH) || !isNum(hiH)) return { code: 'lw_need_both', sources: ['PAGASA_FWFA'] };
  if (loH < 0 || hiH > 24 || loH > hiH) return { code: 'lw_out_of_range', sources: ['PAGASA_FWFA'] };
  const R = DEW_RICE_LB, B = BLAST_WET;
  let code;
  if (hiH < B.germLoH) code = 'lw_under_blast';
  else if (hiH < R.nightLoH) code = 'lw_at_blast';

     wetter parts reach it. One verdict cannot say that, so the card adds a line when it happens. */
  const straddlesBlast = loH < B.germLoH && hiH >= B.germLoH;

     range that starts below it always leaves part of the area in the clear, so it is never the flat
     verdict for its band, only the half-step below. The ladder is ordinal: longer wetness is worse for
     infection, but nothing published says by how much. */

    lw_at_blast:     ['bad',            'somewhat_bad'],

    lw_beyond_dew:   ['worst',          'worse']

  const newsLevel = NEWS[code][straddlesBlast ? 1 : 0];
  return { code: code, loH: loH, hiH: hiH, spanH: hiH - loH, straddlesBlast: straddlesBlast, newsLevel: newsLevel,
    germLoH: B.germLoH, germHiH: B.germHiH, refLoH: R.nightLoH, refHiH: R.nightHiH,
    sources: ['PAGASA_FWFA', 'PACIFICPESTS_BLAST', 'LUO2000'] };
}

/* days: [{Tmin, hoursRH90}] last two days */
function huttonCriteria(days) {
  if (!days || days.length < 2) return { code: 'need_two_days', sources: ['HUTTON'] };
  const two = days.slice(-2);
  const met = two.every(d => d.Tmin >= 10 && d.hoursRH90 >= 6);
  return { code: met ? 'hutton_high_risk' : 'hutton_not_met', sources: ['HUTTON'], caveat: 'uk_not_tested_elsewhere' };
}

/* =====================================================================

  'NSIC Rc240 (Tubigan 22)': { tp: 115, ds: 108 }, 'NSIC Rc238 (Tubigan 21)': { any: 110 }, 'NSIC Rc226 (Tubigan 20)': { tp: 112, ds: 104 }

function harvestWindow(variety, method, sowDateUTC) {
  const v = RICE_VARIETIES[variety]; if (!v) return { error: 'unknown_variety' };
  let days = v[method] != null ? v[method] : (v.any != null ? v.any : (v.ds != null ? v.ds : v.tp));

/* The reading window compares the device clock against sun times computed for UTC+8. On a device set

const tzHours = () => -new Date().getTimezoneOffset() / 60;

  form.append(Tn.row, RH.row, sky.row, wind.row, lwLo.row, lwHi.row, lwNote, h, hNote, hOn.row, a1.row, a2.row, b1.row, b2.row, el('button', { type: 'submit', class: 'btn primary' }, bi(T.ui.compute)));
  const syncLogger = () => { const on = hOn.input.checked; [a1, a2, b1, b2].forEach(x => { x.row.hidden = !on; }); };
  hOn.input.addEventListener('change', syncLogger); syncLogger();
  const out = el('div'); root.append(form, out);
  function run() {
    const inp = { T: num(Tn.input), RH: num(RH.input), sky: sky.input.value, wind: wind.input.value, lwLo: num(lwLo.input), lwHi: num(lwHi.input), logger: hOn.input.checked, a1: num(a1.input), a2: num(a2.input), b1: num(b1.input), b2: num(b2.input) };
    remember('disease', inp); out.innerHTML = '';
    if (badRH(inp.RH)) { show(out, result({ level: 'info', verdict: t(T.verdicts.bad_rh) })); return; }
    const L0 = store.loc, now0 = fieldNow();
    const stT = A.sunTimes(L0.lat, L0.lon, todayJ(now0), fieldTz()), stN = A.sunTimes(L0.lat, L0.lon, todayJ(new Date(now0.getTime() + 86400000)), fieldTz());
    const nowH0 = fieldHourNow();  // compared against field-time sun times, so it must be field time too
    const hhmm0 = h => { const x = ((h % 24) + 24) % 24; return String(Math.floor(x)).padStart(2, '0') + ':' + String(Math.round((x % 1) * 60)).padStart(2, '0'); };
    /* Built here, rendered last. A forecast does not depend on when the thermometer was read, so it must
       survive the reading-time gate below, which returns early. But it must never lead: this card exists to
       say that a reading from your own field beats a row covering a whole forecast area, and the order the
       answers appear in is that argument. Local first, PAGASA underneath it. */
    let lwPanel = null;
    if (inp.lwLo != null || inp.lwHi != null) {
      const lwr = A.leafWetnessReport(inp.lwLo, inp.lwHi);
      lwPanel = result({ level: 'info', verdict: t(T.verdicts[lwr.code], { lo: fmt(inp.lwLo, 1), hi: fmt(inp.lwHi, 1), blo: A.BLAST_WET.germLoH, bhi: A.BLAST_WET.germHiH,
          /* A range starting below the germination figure is not one piece of news: the dry end of the
             area is fine and the wet end is not. The headline says which end it is talking about. */
          news: { good: 'Good news', somewhat_bad: 'Somewhat bad news', bad: 'Bad news', somewhat_worse: 'Somewhat worse news', worse: 'Worse news', worst: 'Worst news' }[lwr.newsLevel],
          newsF: { good: 'Magandang balita', somewhat_bad: 'Medyo hindi magandang balita', bad: 'Masamang balita', somewhat_worse: 'Medyo mas masamang balita', worse: 'Mas masamang balita', worst: 'Pinakamasamang balita' }[lwr.newsLevel],
          scope: lwr.straddlesBlast ? ' for the wetter parts of your area' : '',
          scopeF: lwr.straddlesBlast ? ' para sa mas basang bahagi ng inyong lugar' : '', rlo: fmt(A.DEW_RICE_LB.nightLoH, 1), rhi: fmt(A.DEW_RICE_LB.nightHiH, 1) }),
        lines: lwr.straddlesBlast ? [[bi({ en: 'Your area is split', fil: 'Hati ang inyong lugar' }),
          bi({ en: 'The drier parts stay under ' + A.BLAST_WET.germLoH + ' h, but the wetter parts reach ' + fmt(inp.lwHi, 1) + ' h. Which one your own field is, only you can say.',
            fil: 'Ang mas tuyong bahagi ay wala pang ' + A.BLAST_WET.germLoH + ' oras, ngunit ang mas basang bahagi ay umaabot sa ' + fmt(inp.lwHi, 1) + ' oras. Kung alin doon ang bukid ninyo, kayo lamang ang makapagsasabi.' })]] : null,
        why: ['Leaf wetness hours count how much of the day free water sits on the leaf surface, from dew, rain or irrigation. It matters because fungi and bacteria need the leaf wet to germinate and get inside it, so the same weather that wets the crop for two hours and for twelve are not the same weather at all.',
          'This is PAGASA\'s own figure from the daily Farm Weather Forecast, reported back to you exactly as published. The app does not recompute it or convert it.',
          'The column is published as a range across a whole forecast area, in the same way the temperature and humidity columns beside it are. The low figure and the high figure describe different places inside that area, not the start and end of one night.',
          '<table class="wet"><caption>Germination is the first step, not infection itself, and blast is the only disease in this app\'s range with a published wetness figure. Other diseases also need the leaf wet, but their hours are not established for Philippine conditions, so no risk level is attached to any row.</caption><tr><th>Hours the leaves stay wet</th><th>What is published about it</th></tr><tr><td>under 6 h</td><td>Short of what rice blast spores need. Jackson (2017): "the leaves need to be wet for 6-8 hours for spore germination".</td></tr><tr><td>6 to 8 h</td><td>Long enough for rice blast spores to germinate, with 24 to 28 &deg;C favourable and humidity close to 100% needed for infection (Jackson 2017).</td></tr><tr><td>9 to 12.8 h</td><td>What was actually measured on a clear, calm, dewing night on lowland rice at Los Ba&ntilde;os, dry season (Luo and Goudriaan 2000). Past the blast germination figure for several hours.</td></tr><tr><td>over 12.8 h</td><td>Longer than dew alone gave on any night in that record. Something else is keeping the crop wet, usually rain or fog.</td></tr></table>',
          'The yardstick it is set against is the only measured dew duration from a Philippine rice field: Luo and Goudriaan (2000) watched the leaves every 15 minutes for 16 rain-free nights at IRRI Los Baños in the 1994 dry season and recorded 9.0 to 12.8 hours on heavy dew nights. That is what a clear, calm, dewing night on lowland paddy looks like, so it tells you whether the forecast spell is short or long. Cloud and wind cut dew short, which is why a cloudy night can forecast far fewer hours.'],
        limits: ['No disease risk is scored from these hours, and the table above is not a risk scale. It places the forecast beside two published figures and stops there.',
          'The blast figure is for spore germination, which is the first step in infection and not the same as a diseased crop. Whether infection follows depends on the spores being present, on humidity near 100%, on the variety, and on the crop stage.',
          'A forecast covers an area, not your field. Where PAGASA and this card differ, follow PAGASA.',
          'Leaf wetness hours and hours at or above 90% humidity are different quantities. Do not put these numbers in the Hutton boxes below.',
          'The measured yardstick is lowland paddy rice at one site in one dry season, on clear rain-free nights.'],
        sources: ['PAGASA_FWFA', 'LUO2000', 'PACIFICPESTS_BLAST'] });
    }
    /* Dew is a night question, so a reading taken while the air is still warming says nothing about it. */
    if (inp.T != null && inp.RH != null && !A.frostReadingUsable(nowH0, stT.sunset, stN.sunrise)) {
      show(out, result({ level: 'info',
        verdict: { en: 'Too early in the day to judge tonight.', fil: 'Masyadong maaga pa sa araw upang hatulan ang gabi.' },
        lines: [[bi({ en: 'Read again after', fil: 'Magbasa uli pagkatapos ng' }), hhmm0(((stT.sunset - A.FROST.readingBeforeSunsetH) % 24 + 24) % 24) + ' (sunset ' + hhmm0(stT.sunset) + ')']],
        why: ['Dew forms as the surface cools through the night. Until the air has begun cooling, a reading carries no information about tonight: the air will warm further, peak, and only then start falling.'],
        sources: ['FAO56', 'FAO_FROST'] }));
      if (lwPanel) show(out, lwPanel);
      return;
    }
    if (inp.T != null && inp.RH != null) {
      const d = A.dewTonight(inp.T, inp.RH, inp.sky, inp.wind);
      show(out, result({ level: (d.code === 'dew_less_likely') ? 'go' : 'caution', verdict: t(T.verdicts[d.code], { td: fmt(d.dewPoint, 1), dep: fmt(d.depression, 1) }), lines: (function () {
          const ls = [
            [bi({ en: 'Read any time between', fil: 'Puwedeng magbasa mula' }), hhmm0(stT.sunset - A.FROST.readingBeforeSunsetH) + ' and ' + hhmm0(stN.sunrise) + ' at your field, and the later in that window the better', 'minor'],
            [bi({ en: 'Air temperature now', fil: 'Temperatura ng hangin ngayon' }), fmt(inp.T, 1) + ' °C, what you measured'],
            [bi({ en: 'Dew point', fil: 'Dew point' }), fmt(d.dewPoint, 1) + ' °C, the temperature the air must fall to before dew forms'],
            [bi({ en: 'Still to cool', fil: 'Lamig na kailangan pa' }), fmt(d.depression, 1) + ' °C, the difference between the two figures above']
          ];
          /* The end of wetness can be given, because the sun sets it: Luo & Goudriaan measured dew outlasting
             sunrise by 1.4 to 3.4 h on rice. The start cannot: no published method gets dew onset from a single
             evening reading. So the card anchors their measured range to this location's own sunrise. */
          if (d.code !== 'dew_less_likely') {
            const R = A.DEW_RICE_LB;
            ls.push([bi({ en: 'Leaves likely dry by', fil: 'Malamang tuyo na ang dahon bandang' }),
              bi({ en: 'If tonight is clear, calm, and rain-free like the nights this came from, the leaves should be dry by ' + hhmm0(stN.sunrise + R.afterSunriseHiH) + ' at the latest, possibly as early as ' + hhmm0(stN.sunrise + R.afterSunriseLoH) + '. This is your sunrise, ' + hhmm0(stN.sunrise) + ', plus the ' + R.afterSunriseLoH + ' to ' + R.afterSunriseHiH + ' hours dew lasted past sunrise on rice at IRRI Los Baños. Rain or fog would keep the leaves wet well past this, and the card cannot detect either. If PAGASA forecasts a longer wet spell, follow PAGASA: the ' + R.afterSunriseHiH + ' hours is only the longest measured at one site and is not realistic every time.'
                + (Math.abs(L0.lat) > 23.5 ? ' Those hours were measured in the tropics. At your latitude the morning sun climbs more slowly, so expect longer, not shorter.' : ''),
                fil: 'Kung maaliwalas, walang hangin, at walang ulan ngayong gabi tulad ng mga gabing pinagkunan nito, dapat tuyo na ang dahon nang hindi lalampas sa ' + hhmm0(stN.sunrise + R.afterSunriseHiH) + ', maaaring kasing-aga ng ' + hhmm0(stN.sunrise + R.afterSunriseLoH) + '. Ito ang pagsikat ng araw sa inyo, ' + hhmm0(stN.sunrise) + ', kasama ang ' + R.afterSunriseLoH + ' hanggang ' + R.afterSunriseHiH + ' oras na tinagal ng hamog pagkalipas ng pagsikat ng araw sa palayan sa IRRI Los Baños. Ang ulan o hamog ay magpapatagal pa nito nang husto, at hindi ito natutukoy ng card. Kung mas mahabang pagkabasa ang taya ng PAGASA, sundin ang PAGASA: ang ' + R.afterSunriseHiH + ' oras ay ang pinakamahabang nasukat sa iisang lugar lamang at hindi makatotohanan sa lahat ng pagkakataon.'
                + (Math.abs(L0.lat) > 23.5 ? ' Sinukat ang mga oras na iyon sa tropiko. Sa latitud ninyo ay mas mabagal sumikat ang araw, kaya asahang mas matagal, hindi mas maikli.' : '') }), 'key']);
            ls.push([bi({ en: 'Whole wet period measured there', fil: 'Buong haba ng pagkabasa roon' }),
              bi({ en: R.nightLoH.toFixed(1) + ' to ' + R.nightHiH.toFixed(1) + ' h, from when dew formed in the evening until it dried the next morning. The ' + R.afterSunriseLoH + ' to ' + R.afterSunriseHiH + ' hours after sunrise above are the tail end of it, not a separate thing. Measured on ' + R.nights + ' heavy dew nights at that one site, not calculated for your field.',
                fil: R.nightLoH.toFixed(1) + ' hanggang ' + R.nightHiH.toFixed(1) + ' oras, mula nang magsimula ang hamog kinagabihan hanggang sa matuyo ito kinabukasan. Ang ' + R.afterSunriseLoH + ' hanggang ' + R.afterSunriseHiH + ' oras pagkatapos sumikat ang araw sa itaas ay ang dulo nito, hindi hiwalay na bagay. Sinukat sa ' + R.nights + ' gabing malakas ang hamog sa iisang lugar, hindi kinalkula para sa bukid ninyo.' }), 'minor']);
          }
          return ls;
        })(),
        why: ['Dew forms when a surface cools to the dew point (FAO-56 definition; FAO frost manual). Clear, calm nights cool most.',
          'A reading taken before the air has begun cooling says nothing about the night, which is why the window opens two hours before sunset. Later is better inside that window: every hour you wait is an hour of cooling that has already happened and no longer has to be guessed at. The FAO frost manual takes its own readings two hours after sunset.', 'The question is about the morning, not the evening, because dew that forms early is close to universal on a clear, calm night and tells you little on its own. What decides infection is how long the leaves stay wet, and that period runs from the moment dew forms until the sun dries it, usually well into the morning. A night that leaves the crop wet at dawn is the one that matters.',
          'How long leaves stay wet after dawn has been measured on rice in this country. Luo and Goudriaan (2000) checked dew onset and drying every 15 minutes over 16 rain-free nights at IRRI Los Baños in the 1994 dry season, on IR72. Dew lasted 1.4 to 3.4 hours after sunrise, and the whole dew period on the top leaves ran 9.0 to 12.8 hours on heavy dew nights. Shielding the crop to cut the dew period short moved the drying time by only 0 to 2 hours, because what dries the leaves is the sun coming up, not when the dew began. So on a night that dews, expect the crop to still be wet for the first hours of the morning. Those figures are lowland paddy in the dry season at one site, and have not been repeated elsewhere in the Philippines.',
          'Wet leaves through the night favour fungal and bacterial disease generally. For rice, IRRI names this pattern for blast: it occurs "in areas with low soil moisture, frequent and prolonged periods of rain shower, and cool temperature in the daytime", and in upland rice "large day-night temperature differences that cause dew formation on leaves and overall cooler temperatures favor the development of the disease" (IRRI Rice Knowledge Bank). That is a description of the weather, not a threshold, so this card reports the dew and does not score blast risk.',
          'What IRRI gives for blast is management rather than a number: plant resistant varieties and ask your local agriculture office which ones are current; sow early, after the onset of the rainy season; split the nitrogen, because excessive fertiliser increases blast intensity; and flood the field as often as possible.'], limits: ['Hours of leaf wetness are not calculated for your own field. The RH ≥ 90% method needs humidity recorded right through the night, not one evening reading, and its threshold has to be fitted locally: Sentelhas et al. (2008) fitted 83, 85, 90 and 92% at four sites on turfgrass. No Philippine fit is published.', 'The drying time above is your own sunrise plus a range measured on rice at one lowland site in the 1994 dry season (Luo and Goudriaan 2000). Sunrise is calculated for your location; the rest is measurement from elsewhere, not a prediction for your field, crop or season.', 'The start of the wet period is not given, because no published method gets the moment dew forms from a single evening reading.'], sources: ['FAO56', 'FAO_FROST', 'SENTELHAS2008', 'LUO2000'] }));
    }
    if (lwPanel) show(out, lwPanel);
    if (inp.logger && inp.a1 != null && inp.a2 != null && inp.b1 != null && inp.b2 != null) {
      const hcr = A.huttonCriteria([{ Tmin: inp.b1, hoursRH90: inp.b2 }, { Tmin: inp.a1, hoursRH90: inp.a2 }]);
      show(out, result({ level: hcr.code === 'hutton_high_risk' ? 'stop' : 'go', verdict: t(T.verdicts[hcr.code]), why: ['Hutton Criteria: "two consecutive days have a minimum temperature of 10°C, and at least six hours of relative humidity at or above 90%" (James Hutton Institute, via the IPM Decisions factsheet).'], limits: ['Developed and tested in the UK; "not tested yet in other countries" (IPM Decisions).'], sources: ['HUTTON'] }));
    }
  }
};

/* TIMING */
CARDS.timing = function (root) {
  const prev = recall('timing');
  const form = el('form', { class: 'card-form', onsubmit: e => { e.preventDefault(); run(); } });
  form.appendChild(locationBlock());
  const variety = selectInput('tVar', { en: 'Rice variety', fil: 'Uri ng palay' }, Object.keys(A.RICE_VARIETIES).map(k => [k, { en: k, fil: k }]), prev.variety || 'NSIC Rc222 (Tubigan 18)');
  const method = selectInput('tMet', { en: 'Establishment', fil: 'Paraan ng pagtatanim' }, [['tp', { en: 'Transplanted', fil: 'Lipat-tanim' }], ['ds', { en: 'Direct seeded', fil: 'Sabog-tanim' }]], prev.method || 'tp');
  const sow = dateInput('tSow', { en: 'Sowing date', fil: 'Petsa ng pagpunla' }, prev.sow, { prefilled: true });
  const h2 = el('h4', null, bi({ en: 'Corn heat units (tracker only)', fil: 'Init na naipon ng mais (pagsubaybay lang)' }));
  const plant = dateInput('tPlant', { en: 'Corn planting date', fil: 'Petsa ng pagtatanim ng mais' }, prev.plant, { optional: true });
  const tx = numInput('tTx', { en: 'Typical afternoon high since planting (°C)', fil: 'Karaniwang pinakamainit mula nang itanim (°C)' }, prev.tx, 0.1, { optional: true }), tn = numInput('tTn', { en: 'Typical morning low since planting (°C)', fil: 'Karaniwang pinakamalamig mula nang itanim (°C)' }, prev.tn, 0.1, { optional: true });
  form.append(variety.row, method.row, sow.row, h2, plant.row, tx.row, tn.row, el('button', { type: 'submit', class: 'btn primary' }, bi(T.ui.compute)));
  const out = el('div'); root.append(form, out);
  function run() {
    const inp = { variety: variety.input.value, method: method.input.value, sow: sow.input.value, plant: plant.input.value, tx: num(tx.input), tn: num(tn.input) };
    remember('timing', inp); out.innerHTML = '';
    if (inp.tx != null && inp.tn != null && inp.tx < inp.tn) { show(out, result({ level: 'info', verdict: t(T.verdicts.bad_minmax) })); return; }
    const L = store.loc, now = new Date(), J = todayJ(now);
    const h = A.harvestWindow(inp.variety, inp.method, new Date(inp.sow + 'T00:00:00Z'));
    /* The date is the weakest thing on this card, so it leads with what the farmer can see instead.
       PalayCheck Key Check 8 gives criteria in the field; the date only says when to start looking. */
    const lines = [
      [bi({ en: 'When to cut (PhilRice PalayCheck, Key Check 8)', fil: 'Kailan gapasin (PhilRice PalayCheck, Key Check 8)' }), bi({ en: '85 to 90% of the grains golden yellow for manual harvest, 90 to 95% with a combine.', fil: '85 hanggang 90% ng butil ay dilaw-ginto kung manu-manong gapas, 90 hanggang 95% kung combine harvester.' }), 'key'],
      [bi({ en: 'Grain moisture at harvest', fil: 'Halumigmig ng butil sa pag-ani' }), bi({ en: '18 to 21% in the dry season, 20 to 25% in the wet season.', fil: '18 hanggang 21% sa tag-araw, 20 hanggang 25% sa tag-ulan.' })],
      [bi({ en: 'Before harvest', fil: 'Bago umani' }), bi({ en: 'Drain the field 1 to 2 weeks before the expected date.', fil: 'Patuyuin ang bukid 1 hanggang 2 linggo bago ang inaasahang petsa.' })],
      [bi({ en: 'Maturity for this variety (PhilRice)', fil: 'Gulang ng uring ito (PhilRice)' }), h.days + ' days'],
      [bi({ en: 'Daylight today here', fil: 'Haba ng araw dito ngayon' }), fmt(A.daylight(L.lat, J), 1) + ' hours (FAO-56 Eq. 34)']];
    const flags = h.flag ? [CODES[h.flag]] : [];
    if (inp.plant && inp.tx != null && inp.tn != null) {
      const days = Math.max(0, Math.round((now - new Date(inp.plant + 'T00:00:00')) / 86400000));
      const g = A.gdd(inp.tx, inp.tn, 10, 30, 2) * days;
      lines.push([bi({ en: 'Corn heat units since planting', fil: 'Init na naipon ng mais mula nang itanim' }), fmt(g, 0) + ' °C·day over ' + days + ' days (base 10 °C, cap 30 °C, McMaster and Wilhelm method 2); no stage target is published for Philippine hybrids, so this is a tracker only']);
    }
    show(out, result({ level: 'info', verdict: t(T.verdicts.harvest, { date: h.date.toISOString().slice(0, 10) }), lines, why: ['Maturity days from the PhilRice Pinoy Rice Knowledge Bank variety pages, counted from sowing as the pages state.', 'Heat units: GDD = (Tmax + Tmin)/2 − 10 with Tmax and Tmin clamped to 10 and 30 °C (McMaster and Wilhelm 1997, corn values from Cross and Zuber 1972).'], flags, assumptions: ['The harvest date is an orientation, not a promise: it says when to start looking at the crop. Judge the cut by PalayCheck Key Check 8 above.', 'Any window of about a week around this date would be a design assumption; PhilRice publishes none, and a week is probably too narrow. Cauba et al. (2025) estimated harvest dates for 99 Philippine rice fields from Sentinel-1 against farmer-reported dates and report root mean squared differences of 16 to 17.5 days in the dry season and 8 to 22 days in the wet. That is detection rather than prediction, but it is the closest published measure and it is wider than a week.', 'Heat units use one typical high and low for the whole period; enter daily values in a later version for a true sum.'], limits: ['Day length is the astronomical value, not a photoperiod threshold for any variety.'], sources: h.sources.concat(['PALAYCHECK', 'CAUBA2025', 'MCMASTER1997', 'FAO56']) }));
  }
};

/* SOURCES */
CARDS.sources = function (root) {
  const groups = { primary: 'Primary standards and peer-reviewed papers', regulatory: 'Regulatory texts and labels', extension: 'Extension guidance (IRRI, PhilRice, DA, GRDC, Queensland DAF, universities)', secondary: 'Secondary reproductions (the primary text was not accessible)' };
  Object.keys(groups).forEach(cls => {
    const items = Object.keys(A.REFS).filter(k => A.REFS[k].cls === cls);
    if (!items.length) return;
    root.appendChild(el('h3', null, groups[cls]));
    const ul = el('ul', { class: 'refs' });
    items.forEach(k => { const r = A.REFS[k]; ul.appendChild(el('li', null, el('code', null, k), ' ', r.cite, ' ', refLinks(k && r))); });
    root.appendChild(ul);
  });
  root.appendChild(el('h3', null, bi({ en: 'Cannot be verified against a primary source', fil: 'Hindi mabeberipika sa pangunahing sanggunian' })));
  const ul = el('ul', { class: 'refs' }); A.UNVERIFIED.forEach(u => ul.appendChild(el('li', null, u.text))); root.appendChild(ul);
  root.appendChild(el('h3', null, bi({ en: 'How estimates are shown', fil: 'Paano ipinapakita ang mga tantiya' })));
  root.appendChild(el('p', null, 'Whenever an input is missing, the app uses the fallback that FAO-56 itself documents (dew point from the morning low, sunlight from the temperature range, 2 m/s wind) and lists it under "Estimated, not measured" on the result, with FAO-56\'s own statement of what it costs. Values outside a formula\'s published range are flagged, not silently returned.'));
};

/* Which agency holds the mandate for each calculator. Shown at the top of every card, so the farmer

  disease: { en: 'DA and the Bureau of Plant Industry issue the official plant health guidance, and PAGASA the official weather data. Where they differ from this card, follow them.', fil: 'Ang DA at ang Bureau of Plant Industry ang naglalabas ng opisyal na patnubay sa kalusugan ng halaman, at ang PAGASA ng opisyal na datos ng panahon. Sundin sila kung iba sa card na ito.' },

/* How and when each reading must be taken. Shown under the authority note, above the inputs, because

  rain:    { en: 'Use the total your gauge collected over the whole month, not a single storm.', fil: 'Gamitin ang kabuuang naipon ng panukat ng ulan (ulansukod) sa buong buwan, hindi ang isang ulan lamang.' },
  spray:   { en: 'Take these readings where and when you intend to spray. Conditions change within the hour, so a reading from earlier in the morning does not describe the afternoon.', fil: 'Basahin ito sa lugar at oras na balak mong mag-spray. Nagbabago ang kondisyon kada oras, kaya hindi naglalarawan ng hapon ang pagbasa kaninang umaga.' },
  dry:     { en: 'Read the air beside the drying area in the early afternoon, when it is hottest and driest. Keep the instruments out of direct sun: in the sun a thermometer reads its own heated bulb, not the air, and the answer comes out too hopeful. A morning reading understates what the day can dry.', fil: 'Basahin ang hangin sa tabi ng patuyuan sa maagang hapon, kung kailan pinakamainit at pinakatuyo. Huwag ilagay sa tuwirang araw ang mga kagamitan: sa araw, ang nababasa ng termometro ay ang sarili nitong init, hindi ang hangin, kaya lumalabas na masyadong maganda ang sagot. Maliit ang ipinapakita ng pagbasa sa umaga.' },
  stress:  { en: 'Use each day\'s actual afternoon high and morning low, not one reading taken now.', fil: 'Gamitin ang tunay na pinakamainit sa hapon at pinakamalamig sa umaga bawat araw, hindi ang isang pagbasa ngayon.' },

  disease: { en: 'Take the temperature and humidity outdoors in the evening, near the crop. The late blight section below is separate and needs a data logger; leave it blank if you do not have one.', fil: 'Sukatin ang temperatura at halumigmig sa labas kinagabihan, malapit sa pananim. Hiwalay ang late blight sa ibaba at kailangan nito ng data logger; huwag punan kung wala kayo nito.' },

};

/* What the farmer physically needs before starting. Shown above the inputs, because the commonest
   confusion reported is not knowing what to go and fetch. */
const NEEDS = {
  water:   { en: 'A maximum and minimum thermometer, the kind that holds the highest and lowest reading until you reset it, kept in the shade. The high comes in the afternoon and the low just before sunrise, so it must run through the night as well as the day. A rain gauge. Your location, which the phone can fill in. With no thermometer, a phone weather app\'s high and low for the nearest town will serve as a rough stand-in, but it is a forecast for somewhere else: expect error, and more of it if that town sits at a different elevation.', fil: 'Isang max-min na termometro, iyong kayang humawak ng pinakamataas at pinakamababang reading hanggang sa i-reset mo ito, na nakalagay sa lilim. Ang pinakamataas na temperatura ay nangyayari sa hapon at ang pinakamababa bago sumikat ang araw, kaya dapat itong tumagal sa buong gabi pati na rin sa araw. Panukat ng ulan. Ang lokasyon ninyo, na kayang kunin ng smartphone. Kung walang termometro, puwedeng gamiting pahapyaw na panghalili ang mataas at mababang temperatura ng pinakamalapit na bayan sa weather app ng smartphone, ngunit taya iyon para sa ibang lugar: asahan ang pagkakamali, lalo na kung magkaiba ang taas ng lugar.' },
  rice:    { en: 'A stick or ruler to measure the water. An AWD tube (pani tube) as well, if you use safe AWD. No weather app can tell you the depth of water in your own field; this one has to be measured.', fil: 'Patpat o ruler na pansukat ng tubig. Tubo rin sa bukid, kung safe AWD ang ginagamit ninyo. Walang weather app na makapagsasabi ng lalim ng tubig sa bukid ninyo; kailangan itong sukatin mismo.' },
  rain:    { en: 'A rain gauge, read at the same hour each day and added up for the whole month. If you have none, PAGASA publishes monthly rainfall for its stations: use the nearest one, remembering that rainfall can differ a great deal between your field and a station some distance away. A phone weather app is a weaker fallback than the station record, because the rainfall it shows is an estimate for a wide area rather than what fell on your field.', fil: 'Sa panukat ng ulan (ulansukod), basahin sa parehong oras araw-araw at ipunin sa buong buwan. Kung wala kayo nito, naglalathala ang PAGASA ng buwanang ulan sa mga istasyon nito: gamitin ang pinakamalapit, ngunit tandaan na malaki ang maaaring pagkakaiba ng ulan sa bukid ninyo at sa istasyong malayo. Mas mahina ang weather app sa smartphone kaysa sa talaan ng istasyon, dahil tantiya lamang iyon para sa malawak na lugar at hindi ang tunay na bumagsak sa bukid ninyo.' },
  spray:   { en: 'A thermometer and a hygrometer, taken at the spot you will spray. A watch, and some way to judge the wind. Do not take the wind from a phone weather app: drift is decided by the wind in your field at boom height, not at a station kilometres away and ten metres up, and the label holds you to the conditions where you spray.', fil: 'Termometro at hygrometer, sa mismong lugar na sisprayan. Relo, at paraan ng pagtantiya ng hangin. Huwag kunin sa weather app ng smartphone ang hangin: ang pag-anod ng spray ay nakasalalay sa hangin sa mismong bukid ninyo sa taas ng boom, hindi sa istasyong ilang kilometro ang layo at sampung metro ang taas, at ang label ang panagot ninyo sa kondisyon kung saan kayo nagsi-spray.' },
  dry:     { en: 'A thermometer and a hygrometer, shaded from direct sun but standing in the air beside the drying area. A weighing scale. A moisture meter if you have one; otherwise your usual way of judging the grain. A phone weather app\'s humidity is measured somewhere else entirely and will not match your drying floor; use it only if you have nothing at all.', fil: 'Termometro at hygrometer, may silong mula sa tuwirang araw ngunit nasa hangin sa tabi ng patuyuan. Timbangan. Moisture meter kung meron; kung wala, ang nakasanayan ninyong paraan ng pagtingin sa butil. Ang humidity na ipinapakita ng weather app sa smartphone ay sinukat sa ibang lugar at hindi tutugma sa bilaran ninyo; gamitin lamang kung talagang wala kayong ibang paraan.' },
  stress:  { en: 'A maximum and minimum thermometer, the kind that holds the highest and lowest reading until you reset it, kept in the shade. The high comes in the afternoon and the low just before sunrise, so it must run through the night as well as the day. With none, a phone weather app\'s high and low for the nearest town will serve as a rough stand-in, but it is a forecast for somewhere else: expect error, and more of it if that town sits at a different elevation.', fil: 'Isang max-min na termometro, iyong kayang humawak ng pinakamataas at pinakamababang reading hanggang sa i-reset mo ito, na nakalagay sa lilim. Ang pinakamataas na temperatura ay nangyayari sa hapon at ang pinakamababa bago sumikat ang araw, kaya dapat itong tumagal sa buong gabi pati na rin sa araw. Kung wala nito, puwedeng gamiting pahapyaw na panghalili ang mataas at mababang temperatura ng pinakamalapit na bayan sa weather app ng smartphone, ngunit taya iyon para sa ibang lugar: asahan ang pagkakamali, lalo na kung magkaiba ang taas ng lugar.' },
  frost:   { en: 'A thermometer and a hygrometer, read outdoors away from walls, at about head height. If you have neither, a phone weather app for the nearest town can be used, but know which way it is wrong: cold air drains downhill and pools, so a field in a hollow gets colder than the town on a clear, calm night, and the app will read too warm. Treat its number as the warmest your field will be, not the coldest, and take a frost warning seriously even when the app looks safe.', fil: 'Basahin sa labas ang termometro at hygrometer na malayo sa pader, at mga kasintaas ng ulo. Kung wala kayo ng dalawa, puwedeng gamitin ang weather app ng smartphone para sa pinakamalapit na bayan, ngunit alamin kung saan ito nagkakamali: umaagos pababa at namumuo ang malamig na hangin, kaya mas lumalamig ang bukid sa lubak kaysa sa bayan kapag maaliwalas at walang hangin, at mas mainit ang ipapakita ng app. Ituring ninyong pinakamainit na posible ang bilang nito, hindi ang pinakamalamig, at seryosohin ang babala sa andap kahit mukhang ligtas sa app.' },
  disease: { en: 'A thermometer and a hygrometer, read outdoors near the crop in the evening. As with frost, a phone weather app is a poor substitute here, because dew depends on how your own field cools rather than on the town average. Use it only if you have nothing else.', fil: 'Basahin sa labas ang termometro at hygrometer malapit sa pananim kinagabihan. Tulad sa andap mahina ang weather app galing smartphone dito, dahil nakadepende ang hamog sa paglamig ng sarili ninyong bukid at hindi sa karaniwan ng bayan. Gamitin kung wala talaga.' },
  timing:  { en: 'Your planting or sowing dates, and a thermometer for a typical high and low. A phone weather app is acceptable here, because this card wants a typical value for the season rather than a particular day.', fil: 'Ang petsa ng pagtatanim o pagpupunla, at termometro para sa karaniwang mataas at mababa. Puwede ang weather app sa smartphone dito, dahil karaniwang halaga para sa panahon ang hinahanap ng card na ito at hindi ang isang tiyak na araw.' }
};

/* ---------- router ---------- */
const ORDER = ['water', 'rice', 'rain', 'spray', 'dry', 'stress', 'frost', 'disease', 'timing', 'sources', 'about', 'feedback'];
const ICON = { water: '💧', rice: '🌾', rain: '🌧', spray: '🧴', dry: '☀', stress: '🌡', frost: '❄', disease: '🍃', timing: '📅', sources: '📚', about: 'ℹ', feedback: '✉' };
function renderHome(main) {
  main.innerHTML = '';
  main.appendChild(el('p', { class: 'lead' }, bi(T.tagline)));
  const grid = el('div', { class: 'grid' });
  ORDER.forEach(id => { grid.appendChild(el('a', { class: 'tile', href: '#/' + id }, el('span', { class: 'ico' }, ICON[id]), bi(T.cards[id]))); });
  main.appendChild(grid);
  main.appendChild(el('p', { class: 'foot' }, 'Offline. Every answer shows its source. Decision aid, not a prescription. Build 6ed9df25.'));
}
function renderCard(main, id) {
  main.innerHTML = '';
  main.appendChild(el('a', { class: 'back', href: '#/' }, '← ', bi(T.ui.back)));
  main.appendChild(el('h2', null, bi(T.cards[id])));
  if (AUTHORITY[id]) main.appendChild(el('p', { class: 'warn authority' }, bi(AUTHORITY[id])));
  if (NEEDS[id]) main.appendChild(el('p', { class: 'needs' }, el('strong', null, 'What you need / Ano ang kailangan: '), bi(NEEDS[id])));
  if (READING[id]) main.appendChild(el('p', { class: 'reading' }, bi(READING[id])));
  const body = el('div', { class: 'card-body' }); main.appendChild(body);
  CARDS[id](body);
}
function route() {
  const main = $('#main'); const id = (location.hash || '#/').replace('#/', '');
  if (id && CARDS[id]) renderCard(main, id); else renderHome(main);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

/* PWA registration only in a secure context served over http(s) */
try {
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // An installed copy can stay open for days; re-check for a new build whenever it comes back to the foreground.
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
      }).catch(() => {});
    });
  }
} catch (e) {}

/* Install prompt, same pattern as Kalkunahon. Chrome and Edge fire beforeinstallprompt
   when the app is installable and not yet installed; the event is stashed and the
   header button is shown. Browsers that never fire it (Safari, Firefox, embedded
   webviews) keep the button hidden; on iOS use Share > Add to Home Screen. */
let deferredInstall = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  if (installBtn) installBtn.hidden = false;
});
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (!deferredInstall) return;
    installBtn.hidden = true;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
  });
}
window.addEventListener('appinstalled', () => { deferredInstall = null; if (installBtn) installBtn.hidden = true; });
})();

</script>
